<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="favicon.png">
<title>Dyremodtagelse – Booking</title>
<style>
  :root{
    /* Officielle farver fra farveskemaet */
    --green:#006E63;        /* Pantone 562 C */
    --gold:#85754E;         /* Pantone 871 C - mat guld */
    --dark:#1A3C34;         /* Pantone 560 C - mørk grøn */
    --warm:#D6D1CA;         /* Warm Gray 1 C */
    /* Afledte nuancer (ikke i farveskemaet) - se README */
    --bg:#14302A;
    --panel:#21463D;
    --line:rgba(214,209,202,.18);
    --ink:var(--warm);
    --muted:#A9B3AB;
    --gold-lt:#BDAF8E;      /* lysere guld, læsbar som tekst på mørk grøn */
    --danger:#D89A90;       /* signalfarve - findes ikke i farveskemaet */
    --danger-bg:rgba(140,58,48,.28);
    --ok-bg:rgba(0,110,99,.30);
    --pend-bg:rgba(133,117,78,.30);
    --busy-bg:rgba(214,209,202,.10);
    --cream:#E3DAC2;        /* lys guldtone til afventende - afledt */
    --greige:#A69E8E;       /* fremmede bookinger */
    --on-light:#1A3C34;     /* tekst på lyse flader */
    --appr:#7FCBAE;         /* stærkere grøn til egne godkendte bookede slots */
    --pend:#EFC768;         /* stærkere guld til egne afventende bookede slots */
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--dark);border-bottom:1px solid var(--gold);padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:700;color:var(--gold-lt);letter-spacing:.02em}
  nav button{background:transparent;border:1px solid var(--line);color:var(--warm);padding:6px 12px;border-radius:4px;cursor:pointer;margin-right:6px}
  nav button:hover{border-color:var(--gold-lt)}
  nav button.active{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
  .spacer{flex:1}
  main{padding:16px;max-width:1280px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
  h2{font-size:15px;margin:0 0 12px;color:var(--gold-lt)}
  button.btn{background:var(--gold);color:#fff;border:0;padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:600}
  button.btn:hover{background:#93835C}
  button.btn.sec{background:transparent;color:var(--warm);border:1px solid var(--line);font-weight:400}
  button.btn.sec:hover{border-color:var(--gold-lt)}
  button.btn.danger{background:#8C3A30;color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:4px;width:100%;
    background:var(--bg);color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
  select option{background:var(--bg);color:var(--ink)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--gold-lt);font-weight:600;font-size:12px}
  code{color:var(--gold-lt)}
  .cal{display:grid;grid-template-columns:70px repeat(5,1fr);gap:2px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
  .cal .hd{font-weight:600;font-size:12px;padding:6px;text-align:center;background:rgba(214,209,202,.08);border-radius:3px;color:var(--warm)}
  .cal .hd.today{background:var(--gold);color:#fff}
  .cal .hd.closed{background:rgba(0,0,0,.25);color:var(--muted)}
  .cal .tm{font-size:12px;color:var(--muted);padding:4px 6px;text-align:right}
  .cell{min-height:34px;border:1px solid var(--line);border-radius:3px;background:rgba(214,209,202,.04);
        padding:3px 5px;font-size:11px;cursor:pointer;overflow:hidden;color:var(--muted)}
  .cell[data-d]:hover{border-color:var(--gold-lt);background:rgba(133,117,78,.18);color:var(--gold-lt)}
  .cell.disabled{background:rgba(0,0,0,.22);border-color:transparent;cursor:not-allowed;color:transparent}
  .cell.busy{background:var(--greige);border-color:#8B8373;border-left:5px solid #6E6759;
             color:var(--on-light);cursor:default}
  .cell.own{color:var(--on-light);cursor:pointer;font-weight:500}
  .cell.own:hover{filter:brightness(.93)}
  .cell.own.GODKENDT{background:var(--appr);border-color:var(--green);border-left:5px solid var(--green)}
  .cell.own.AFVENTER_GODKENDELSE{background:var(--pend);border-color:var(--gold);border-left:5px solid var(--gold)}
  .cell.own.pre{background-image:repeating-linear-gradient(45deg,rgba(26,60,52,.16) 0 5px,transparent 5px 10px)}
  .cell.cont{border-top-style:dashed;border-top-color:rgba(26,60,52,.35)}
  .more{color:rgba(26,60,52,.78);font-style:italic;font-size:10px;font-weight:400}
  .cell.sel{background:rgba(133,117,78,.45);border-color:var(--gold-lt);box-shadow:inset 0 0 0 1px var(--gold-lt);color:#fff}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid;
       color:var(--on-light);font-weight:600}
  .t-GODKENDT{background:var(--appr);border-color:var(--green)}
  .t-AFVENTER_GODKENDELSE{background:var(--pend);border-color:var(--gold)}
  .t-AFVIST,.t-ANNULLERET{background:rgba(214,209,202,.08);border-color:var(--line);color:var(--muted)}
  .t-warn{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal{background:var(--panel);border:1px solid var(--gold);border-radius:6px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
  .err{background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger);padding:8px 10px;border-radius:4px;margin:10px 0;font-size:13px;white-space:pre-wrap}
  .kpi{display:flex;gap:12px;flex-wrap:wrap}
  .kpi div{flex:1;min-width:120px;background:rgba(214,209,202,.06);border:1px solid var(--line);border-radius:5px;padding:10px}
  .kpi b{display:block;font-size:22px;color:var(--gold-lt)}
  .kpi span{font-size:12px;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  .row>div{flex:1;min-width:130px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .hide{display:none}
  .cat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
  .cat-row .cat-label{color:var(--ink);font-size:14px}
  .stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:190px;flex:0 0 auto}
  .stepper button{flex:0 0 42px;background:rgba(214,209,202,.14);color:var(--ink);border:0;font-size:18px;font-weight:600;line-height:1;cursor:pointer}
  .stepper button:hover{background:rgba(214,209,202,.26)}
  .stepper input{flex:1;min-width:0;text-align:center;background:#fff;color:var(--on-light);border:0;border-radius:0;font-weight:700;font-size:15px;padding:8px 4px}
  .stepper input:focus{outline:2px solid var(--gold);outline-offset:-2px}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper input[type=number]{-moz-appearance:textfield}
  .placeholder-cell{color:var(--muted);font-style:italic}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .toolbar .spacer{flex:1}
  #login{max-width:360px;margin:80px auto}
  #whoami{color:var(--muted)}
  .logo{height:34px;width:auto;display:block}
  .brand{display:flex;align-items:center;gap:12px}
  .brand small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  #login .logo{height:56px;margin:0 auto 14px}
</style>
</head>
<body>

<div id="login" class="panel">
  <img src="logo.png" alt="Himmerlandskød" class="logo">
  <h2 style="text-align:center">Log ind – Dyremodtagelse</h2>
  <label>E-mail</label><input id="li-email" type="email" autocomplete="username">
  <label>Adgangskode</label><input id="li-pass" type="password" autocomplete="current-password">
  <div id="li-err" class="err hide"></div>
  <p><button class="btn" id="li-btn" style="width:100%">Log ind</button></p>
</div>

<div id="app" class="hide">
  <header>
    <div class="brand">
      <img src="logo.png" alt="Himmerlandskød" class="logo">
      <h1>Dyremodtagelse<small>Himmerlandskød</small></h1>
    </div>
    <nav>
      <button data-view="dash" class="active">Dashboard</button>
      <button data-view="cal">Kalender</button>
      <button data-view="list">Bookinger</button>
      <button data-view="admin" id="nav-admin" class="hide">Administration</button>
    </nav>
    <div class="spacer"></div>
    <span id="whoami" style="font-size:12px"></span>
    <button class="btn sec" id="logout">Log ud</button>
  </header>
  <main>
    <div id="v-dash"></div>
    <div id="v-cal" class="hide"></div>
    <div id="v-list" class="hide"></div>
    <div id="v-admin" class="hide"></div>
  </main>
</div>

<div id="modal-root"></div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const sb = createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_PUBLISHABLE_KEY);

const S = { profile:null, settings:null, carriers:[], farmers:[], closed:new Set(),
            weekStart:null, dayStart:0, cal:[], view:'dash', dashShowClosed:true, pickupSelection:new Set() };
const DAYS = ['Mandag','Tirsdag','Onsdag','Torsdag','Fredag'];
const isAdmin = () => S.profile?.role === 'admin';
const $ = id => document.getElementById(id);

// ---------- dato (lokal tid, aldrig toISOString) ----------
const pad = n => String(n).padStart(2,'0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x=new Date(d); return addDays(x,-((x.getDay()+6)%7)); };
const dk = s => { const d=parse(s); return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`; };
const hhmm = t => (t||'').slice(0,5);
const todayStr = () => fmt(new Date());
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const endOf = (t,mins) => { const m=toMin(t)+mins; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };

function slotList(){
  const [oh,om]=S.settings.opening_time.split(':').map(Number);
  const [ch,cm]=S.settings.closing_time.split(':').map(Number);
  const step=S.settings.slot_minutes, out=[];
  for(let m=oh*60+om; m+step<=ch*60+cm; m+=step) out.push(`${pad(Math.floor(m/60))}:${pad(m%60)}`);
  return out;
}
const isOpenDay = ds => { const d=parse(ds); return d.getDay()>=1 && d.getDay()<=5 && !S.closed.has(ds); };

function msg(e){
  if(!e) return '';
  if(e.code === '23P01') return 'Et eller flere af de valgte intervaller er allerede optaget. Opdatér kalenderen og prøv igen.';
  if(e.code === '42501' || (e.message||'').includes('row-level security'))
    return 'Du har ikke rettigheder til denne handling.';
  return e.message || String(e);
}

// ---------- login ----------
$('li-btn').onclick = async () => {
  $('li-err').classList.add('hide'); $('li-btn').disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email:$('li-email').value.trim(), password:$('li-pass').value });
  $('li-btn').disabled = false;
  if(error){ $('li-err').textContent='Login mislykkedes: '+error.message; $('li-err').classList.remove('hide'); }
};
$('li-pass').addEventListener('keydown', e => { if(e.key==='Enter') $('li-btn').click(); });
$('logout').onclick = () => sb.auth.signOut();

// onAuthStateChange fyrer også ved token-refresh og ved tab-fokus (Supabase
// tjekker sessionen igen, når fanen bliver synlig) — ikke kun ved login/logout.
// Kør kun fuld start() når der reelt ikke er en session i gang endnu, ellers
// ville en igangværende redigering (Ret booking, Registrer dyr) blive revet
// væk og brugeren smidt tilbage på Dashboard, hver gang fanen fik fokus igen.
sb.auth.onAuthStateChange((_e,session) => {
  if(!session) return showLogin();
  if(S.profile && S.profile.id === session.user.id) return;
  start(session);
});
sb.auth.getSession().then(({data}) => { data.session ? start(data.session) : showLogin(); });
function showLogin(){ S.profile = null; $('login').classList.remove('hide'); $('app').classList.add('hide'); }

async function start(session){
  const { data:prof } = await sb.from('profiles')
    .select('id,role,carrier_id,full_name').eq('id',session.user.id).maybeSingle();
  if(!prof){
    $('li-err').textContent='Din bruger har ingen profil i systemet. Kontakt administrator.';
    $('li-err').classList.remove('hide'); await sb.auth.signOut(); return;
  }
  S.profile = prof;
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('whoami').textContent = `${session.user.email} (${isAdmin()?'Administrator':'Transportør'})`;
  $('nav-admin').classList.toggle('hide', !isAdmin());
  await loadMaster();
  S.weekStart = monday(new Date());
  setView('dash');
}

async function loadMaster(){
  const [set,car,far,cls] = await Promise.all([
    sb.from('settings').select('*').single(),
    sb.from('carriers').select('*').order('name'),
    sb.from('farmers').select('*').eq('active',true).order('name'),
    sb.from('closed_days').select('*').order('day')
  ]);
  S.settings = set.data; S.carriers = car.data||[]; S.farmers = far.data||[];
  S.closedRows = cls.data||[];
  S.closed = new Set(S.closedRows.map(c=>c.day));
}

// Maskeret kalendervisning: fremmede bookinger kommer tilbage som "Optaget".
async function loadCalendar(from,to){
  const { data,error } = await sb.from('v_calendar').select('*')
    .gte('booking_date',from).lte('booking_date',to)
    .order('booking_date').order('start_time');
  if(error){ console.error(error); return []; }
  return data;
}

// ---------- navigation ----------
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setView(b.dataset.view));
function setView(v){
  S.view = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.view===v));
  ['dash','cal','list','admin'].forEach(x => $('v-'+x).classList.toggle('hide', x!==v));
  ({dash:renderDash, cal:renderCal, list:renderList, admin:renderAdmin})[v]();
}

// ---------- DASHBOARD ----------
async function renderDash(){
  const el = $('v-dash');
  el.innerHTML = '<div class="panel">Indlæser…</div>';
  const today = todayStr(), end = fmt(addDays(new Date(),13));
  const [rows, load] = await Promise.all([
    loadCalendar(today,today),
    sb.from('v_daily_load').select('*').gte('booking_date',today).lte('booking_date',end)
  ]);
  const daily = Object.fromEntries((load.data||[]).map(r=>[r.booking_date,r]));
  const max = S.settings.max_animals_per_day;
  // Antal dyr er maskeret for fremmede bookinger, så dagstotalen tages fra
  // det aggregerede view i stedet for at summere rækkerne.
  const td = daily[today];
  const todayTotal = td ? td.animals_approved + td.animals_pending : 0;

  let days = [];
  for(let i=0;i<14;i++){
    const ds = fmt(addDays(new Date(),i)), d = daily[ds];
    days.push({ ds, open:isOpenDay(ds), appr:d?d.animals_approved:0, pend:d?d.animals_pending:0 });
  }
  if(!S.dashShowClosed) days = days.filter(d=>d.open);
  const peak = Math.max(max, ...days.map(d=>d.appr+d.pend)) * 1.12;
  const W=1080,H=260,PADL=46,PADB=42,PADT=12;
  const bw=(W-PADL-10)/Math.max(1,days.length), y=v=>PADT+(H-PADT-PADB)*(1-v/peak);
  const bars = days.map((d,i)=>{
    const x=PADL+i*bw+4, w=bw-8, tot=d.appr+d.pend;
    if(!d.open) return `<rect x="${x}" y="${PADT}" width="${w}" height="${H-PADT-PADB}" fill="rgba(214,209,202,.05)"/>`;
    const over = tot>max;
    return `<rect x="${x}" y="${y(d.appr)}" width="${w}" height="${Math.max(0,H-PADB-y(d.appr))}" fill="${over?'#8C3A30':'#006E63'}"/>
      <rect x="${x}" y="${y(tot)}" width="${w}" height="${Math.max(0,y(d.appr)-y(tot))}" fill="${over?'#B5675C':'#85754E'}"/>
      ${tot?`<text x="${x+w/2}" y="${y(tot)-4}" font-size="11" text-anchor="middle" fill="#D6D1CA">${tot}</text>`:''}`;
  }).join('');
  const labels = days.map((d,i)=>{
    const p=parse(d.ds);
    return `<text x="${PADL+i*bw+bw/2}" y="${H-PADB+16}" font-size="10" text-anchor="middle" fill="#A9B3AB">${pad(p.getDate())}/${pad(p.getMonth()+1)}</text>
            <text x="${PADL+i*bw+bw/2}" y="${H-PADB+28}" font-size="9" text-anchor="middle" fill="#7E8C84">${['søn','man','tir','ons','tor','fre','lør'][p.getDay()]}</text>`;
  }).join('');

  el.innerHTML = `
  <div class="panel">
    <h2>I dag – ${dk(today)}</h2>
    <div class="kpi">
      <div><b>${todayTotal}</b><span>dyr i alt</span></div>
      <div><b>${rows.length}</b><span>leverancer</span></div>
      <div><b>${rows.length?hhmm(rows[0].start_time):'–'}</b><span>første ankomst</span></div>
      <div><b>${rows.length?hhmm(rows[rows.length-1].end_time):'–'}</b><span>sidste afgang</span></div>
      <div><b>${Math.max(0,max-todayTotal)}</b><span>ledig kapacitet af ${max}</span></div>
    </div>
    ${rows.length?`<table style="margin-top:14px"><tr><th>Tid</th><th>Transportør</th><th>Landmand</th><th>Dyr</th><th>Type</th><th>Status</th></tr>
      ${rows.map(r=>`<tr>
        <td>${hhmm(r.start_time)}–${hhmm(r.end_time)}</td>
        <td>${esc(r.carrier_label)}</td><td>${esc(r.farmer_label||'')}</td>
        <td>${r.animal_count ?? '–'}</td><td>${r.type==='PREBOOKING'?'Prebooking':'Booking'}</td>
        <td><span class="tag t-${r.status}">${statusTxt(r.status)}</span></td></tr>`).join('')}
      </table>`:'<p style="color:var(--muted)">Ingen leverancer registreret i dag.</p>'}
  </div>

  <div class="panel">
    <div class="row" style="align-items:center;margin-bottom:0">
      <h2 style="flex:1">14 dage frem – antal dyr pr. dag</h2>
      <label style="flex:0;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap">
        <input type="checkbox" id="dash-showclosed" style="width:auto" ${S.dashShowClosed?'checked':''}>
        Vis weekend og helligdage</label>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <line x1="${PADL}" y1="${H-PADB}" x2="${W-6}" y2="${H-PADB}" stroke="rgba(214,209,202,.25)"/>
      <line x1="${PADL}" y1="${y(max)}" x2="${W-6}" y2="${y(max)}" stroke="#D89A90" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="${PADL+4}" y="${y(max)-5}" font-size="11" fill="#D89A90">Maks. ${max} dyr/dag</text>
      <text x="6" y="${y(max)+4}" font-size="10" fill="#A9B3AB">${max}</text>
      <text x="6" y="${H-PADB+4}" font-size="10" fill="#A9B3AB">0</text>
      ${bars}${labels}
    </svg>
    <div class="legend">
      <span><i style="background:#006E63"></i>Godkendt</span>
      <span><i style="background:#85754E"></i>Afventer godkendelse</span>
      <span><i style="background:#8C3A30"></i>Over dagsloft</span>
      ${S.dashShowClosed?'<span><i style="background:rgba(214,209,202,.10)"></i>Lukket (weekend/helligdag)</span>':''}
    </div>
  </div>`;
  $('dash-showclosed').onchange = () => { S.dashShowClosed = $('dash-showclosed').checked; renderDash(); };
}

// ---------- KALENDER ----------
// Under en breakpoint vises kun 1-2 dage ad gangen i stedet for hele
// arbejdsugen, så kolonnerne ikke bliver uleselige på mobil. Hele ugens
// data hentes stadig i ét kald (loadCalendar) — kun hvilke dage der
// tegnes, afhænger af skærmbredden. S.dayStart (0-4) er hvilken dag i
// Mon-Fre-ugen der er først synlig; ignoreres (altid 0) når alle 5 vises.
function calDaysShown(){
  const w = window.innerWidth;
  return w < 480 ? 1 : w < 768 ? 2 : 5;
}
// Flytter det synlige vindue ±nDays dage. Løber vinduet ud over ugens
// kant, hopper det til nabo-ugen i stedet for at vise weekend-dage.
function shiftDayStart(dir){
  const nDays = calDaysShown();
  if(nDays===5){ S.weekStart = addDays(S.weekStart, dir*7); S.dayStart = 0; return; }
  const maxStart = 5 - nDays;
  if(dir > 0){
    if(S.dayStart >= maxStart){ S.weekStart = addDays(S.weekStart,7); S.dayStart = 0; }
    else S.dayStart = Math.min(S.dayStart + nDays, maxStart);
  } else {
    if(S.dayStart <= 0){ S.weekStart = addDays(S.weekStart,-7); S.dayStart = maxStart; }
    else S.dayStart = Math.max(S.dayStart - nDays, 0);
  }
}

async function renderCal(){
  const el = $('v-cal');
  const from = fmt(S.weekStart), to = fmt(addDays(S.weekStart,4));
  el.innerHTML = '<div class="panel">Indlæser…</div>';
  S.cal = await loadCalendar(from,to);
  const slots = slotList(), today = todayStr();
  const at = (ds,t) => S.cal.find(b => b.booking_date===ds
      && toMin(hhmm(b.start_time))<=toMin(t) && toMin(hhmm(b.end_time))>toMin(t));

  const nDays = calDaysShown();
  const maxStart = Math.max(0, 5-nDays);
  S.dayStart = Math.min(Math.max(S.dayStart,0), maxStart);
  const dayIdx = Array.from({length:nDays}, (_,k) => S.dayStart+k);
  const visFrom = fmt(addDays(S.weekStart,dayIdx[0])), visTo = fmt(addDays(S.weekStart,dayIdx[dayIdx.length-1]));
  const rangeLabel = nDays===5
    ? `Uge ${isoWeek(S.weekStart)} · ${dk(visFrom)} – ${dk(visTo)}`
    : (nDays===1 ? dk(visFrom) : `${dk(visFrom)} – ${dk(visTo)}`);

  let grid = `<div class="cal" style="grid-template-columns:70px repeat(${nDays},1fr)"><div class="hd"></div>`;
  for(const i of dayIdx){
    const ds = fmt(addDays(S.weekStart,i));
    const cl = S.closedRows.find(c=>c.day===ds);
    grid += `<div class="hd ${ds===today?'today':''} ${cl?'closed':''}">${DAYS[i]}<br>${dk(ds)}${cl?'<br>'+esc(cl.reason||'Lukket'):''}</div>`;
  }
  for(const t of slots){
    grid += `<div class="tm">${t}</div>`;
    for(const i of dayIdx){
      const ds = fmt(addDays(S.weekStart,i)), b = at(ds,t), past = ds < today;
      if(b){
        const first = hhmm(b.start_time)===t;
        const n = b.slot_count;
        const pos = (toMin(t)-toMin(hhmm(b.start_time)))/S.settings.slot_minutes + 1;
        const span = `${hhmm(b.start_time)}–${hhmm(b.end_time)}`;
        const title = n>1 ? `${span} · ${n} intervaller` : span;
        if(b.is_own){
          grid += `<div class="cell own ${b.status} ${b.type==='PREBOOKING'?'pre':''} ${first?'':'cont'}" data-b="${b.id}" title="${title} — klik for at redigere">
            ${first
              ? `<b>${esc(b.carrier_label)}</b>${n>1?` <span style="font-weight:400">(${n} intervaller, ${span})</span>`:''}<br>${b.animal_count} dyr${b.status==='AFVENTER_GODKENDELSE'?' (afventer slagteri)':''}`
              : `<span class="more">↳ ${esc(b.carrier_label)}, ${pos} af ${n}</span>`}</div>`;
        } else {
          grid += `<div class="cell busy ${first?'':'cont'}" title="${title}">
            ${first ? `Optaget${n>1?` (${n} intervaller, ${span})`:''}` : `<span class="more">↳ optaget, ${pos} af ${n}</span>`}</div>`;
        }
      } else if(past || !isOpenDay(ds)){
        grid += `<div class="cell disabled"></div>`;
      } else {
        grid += `<div class="cell" data-d="${ds}" data-t="${t}">+</div>`;
      }
    }
  }
  grid += '</div>';

  el.innerHTML = `<div class="panel">
    <div class="row" style="margin-bottom:12px">
      <div style="flex:0"><button class="btn sec" id="wk-prev">← Forrige</button></div>
      <div style="flex:0"><button class="btn sec" id="wk-today">I dag</button></div>
      <div style="flex:0"><button class="btn sec" id="wk-next">Næste →</button></div>
      <div style="flex:0;color:var(--muted);align-self:center;white-space:nowrap">${rangeLabel}</div>
    </div>${grid}
    <div class="legend">
      <span><i style="background:var(--appr);border-color:var(--green)"></i>Egen godkendt booking</span>
      <span><i style="background:var(--pend);border-color:var(--gold)"></i>Egen afventende</span>
      <span><i style="background:var(--pend);border-color:var(--gold);background-image:repeating-linear-gradient(45deg,rgba(26,60,52,.16) 0 4px,transparent 4px 8px)"></i>Prebooking (skraveret)</span>
      <span><i style="background:var(--greige)"></i>Optaget af anden transportør</span>
      <span><i style="background:rgba(0,0,0,.22)"></i>Lukket / passeret</span>
      <span>Klik på et ledigt interval, eller træk hen over flere i samme dag for at booke dem samlet. Klik på en egen booking for at redigere den.</span>
    </div>
  </div>`;
  $('wk-prev').onclick = () => { shiftDayStart(-1); renderCal(); };
  $('wk-next').onclick = () => { shiftDayStart(1);  renderCal(); };
  $('wk-today').onclick = () => {
    S.weekStart = monday(new Date());
    const dow = (new Date().getDay()+6) % 7; // 0=man .. 6=søn
    S.dayStart = dow <= 4 ? Math.min(dow, Math.max(0,5-calDaysShown())) : 0;
    renderCal();
  };
  enableRangeSelect(el, slots);
  wireCalEdit(el);
}

// Klik på en egen booking i kalenderen åbner den til redigering. v_calendar
// er en maskeret visning uden felter som dyretal pr. kategori og
// landmand — hent den fulde række fra bookings (RLS giver kun adgang til
// egne rækker, admin ser alle) inden formularen åbnes.
function wireCalEdit(el){
  el.querySelectorAll('.cell.own[data-b]').forEach(c => c.addEventListener('click', async () => {
    const { data, error } = await sb.from('bookings')
      .select('*, carriers(name), farmers(name, chr, address, zip_code, city)').eq('id', c.dataset.b).single();
    if(error) return alert(msg(error));
    bookingModal(data.booking_date, hhmm(data.start_time), data);
  }));
}

// Klik og træk hen over flere slots i samme dag. Markeringen stopper ved
// første optagne eller lukkede slot og ved max_slots_per_booking.
function enableRangeSelect(el, slots){
  const cells = [...el.querySelectorAll('.cell[data-d]')];
  const byKey = new Map(cells.map(c => [c.dataset.d+'#'+c.dataset.t, c]));
  const idx = t => slots.indexOf(t);
  const freeAt = (ds,i) => byKey.get(ds+'#'+slots[i]) || null;
  let anchor = null, ds = null, from = 0, to = 0, dragging = false;

  const paint = () => {
    cells.forEach(c => c.classList.remove('sel'));
    if(!dragging) return;
    for(let i=from;i<=to;i++) freeAt(ds,i)?.classList.add('sel');
  };
  const extend = target => {
    if(!dragging || !target || target.dataset.d !== ds) return;
    const t = idx(target.dataset.t);
    const max = S.settings.max_slots_per_booking;
    let a = Math.min(anchor,t), b = Math.max(anchor,t);
    // klip ved første hul i rækken af ledige slots
    let lo = anchor, hi = anchor;
    while(lo-1 >= a && freeAt(ds,lo-1)) lo--;
    while(hi+1 <= b && freeAt(ds,hi+1)) hi++;
    if(hi-lo+1 > max){ t >= anchor ? hi = lo + max - 1 : lo = hi - max + 1; }
    from = lo; to = hi; paint();
  };
  const cellFrom = ev => {
    const p = ev.touches ? ev.touches[0] : ev;
    const n = document.elementFromPoint(p.clientX, p.clientY);
    return n && n.classList.contains('cell') && n.dataset.d ? n : null;
  };

  cells.forEach(c => c.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    dragging = true; ds = c.dataset.d; anchor = idx(c.dataset.t); from = to = anchor;
    paint();
  }));
  el.addEventListener('pointermove', ev => { if(dragging) extend(cellFrom(ev)); });
  // Én global lytter pr. kalendertegning; den forrige fjernes, så træk
  // kan gentages uden at der hobes lyttere op.
  if(window.__hkoedDragUp) window.removeEventListener('pointerup', window.__hkoedDragUp);
  window.__hkoedDragUp = () => {
    if(!dragging) return;
    dragging = false;
    const start = slots[from], count = to - from + 1;
    cells.forEach(c => c.classList.remove('sel'));
    bookingModal(ds, start, null, count);
  };
  window.addEventListener('pointerup', window.__hkoedDragUp);
}

function isoWeek(d){
  const x=new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate()+3-((x.getDay()+6)%7));
  const first=new Date(x.getFullYear(),0,4);
  return 1+Math.round(((x-first)/86400000-3+((first.getDay()+6)%7))/7);
}

// ---------- BOOKINGFORMULAR (ny + admin-redigering) ----------
async function bookingModal(ds, t, existing, preset){
  const slots   = slotList();
  const perSlot = S.settings.max_animals_per_slot;
  const myCarrier = isAdmin() ? null : S.profile.carrier_id;
  const carriers  = S.carriers.filter(c => c.active || c.id===existing?.carrier_id);
  const canMove   = isAdmin() && !!existing;   // kun admin må flytte en booking
  let day = ds, others = [], booked = 0;

  $('modal-root').innerHTML = `<div class="overlay"><div class="modal">
    <h2>${existing ? 'Ret booking' : (isAdmin()?'Ny booking':'Ny bookingforespørgsel')}</h2>
    <div class="hint" id="f-day"></div>
    ${canMove ? `<label>Dato</label><input type="date" id="f-date" value="${ds}">` : ''}
    <label>Transportør</label>
    <select id="f-car" ${myCarrier?'disabled':''}>
      ${carriers.map(c=>`<option value="${c.id}" ${c.id===(existing?.carrier_id||myCarrier)?'selected':''}>${esc(c.name)}</option>`).join('')}
    </select>
    <label>Landmand</label>
    <select id="f-far">${S.farmers.map(f=>
      `<option value="${f.id}" ${f.id===existing?.farmer_id?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
    <div class="row">
      ${canMove ? `<div><label>Starttid</label><select id="f-start"></select></div>` : ''}
      <div><label>Antal intervaller à ${S.settings.slot_minutes} min.</label><select id="f-slots"></select></div>
    </div>
    <label>Dyr pr. kategori</label>
    ${[['ko','Ko/ungko'],['kvie','Kvie'],['kalv','Kalv 8-12'],['ungtyr','Ungtyr 12-24'],['tyr','Tyr 24+'],['stud','Stud']].map(([id,lbl])=>`
    <div class="cat-row"><span class="cat-label">${lbl}</span>
      <div class="stepper">
        <button type="button" data-cat="${id}" data-step="-1">−</button>
        <input id="f-${id}" type="number" min="0" step="1" value="0">
        <button type="button" data-cat="${id}" data-step="1">+</button>
      </div>
    </div>`).join('')}
    <div class="hint" id="f-cap"></div>
    ${isAdmin() ? `<label style="display:flex;align-items:center;gap:6px;margin-top:10px">
      <input type="checkbox" id="f-override" style="width:auto" ${existing?.capacity_override?'checked':''}>
      Tillad at overskride kapacitet pr. interval/dag (admin)</label>` : ''}
    <label>Type</label>
    <select id="f-type">
      <option value="BOOKING">Booking (bekræftet)</option>
      <option value="PREBOOKING">Prebooking (foreløbig)</option></select>
    <label>Bemærkning</label><textarea id="f-note" rows="2"></textarea>
    <div id="f-err" class="err hide"></div>
    <p style="display:flex;gap:8px;margin-top:16px">
      <button class="btn" id="f-save">${existing?'Gem ændringer':(isAdmin()?'Opret booking':'Send forespørgsel')}</button>
      ${existing && ['AFVENTER_GODKENDELSE','GODKENDT'].includes(existing.status) ? `<button class="btn sec" id="f-animals">Registrer dyr</button>` : ''}
      <button class="btn sec" id="f-cancel">Fortryd</button>
    </p>
  </div></div>`;

  const catIds = ['ko','kvie','kalv','ungtyr','tyr','stud'];
  const catTotal = () => catIds.reduce((sum,c) => sum + (parseInt($('f-'+c).value,10)||0), 0);

  if(existing){
    catIds.forEach(c => $('f-'+c).value = existing['n_'+c] ?? 0);
    $('f-type').value    = existing.type;
    $('f-note').value    = existing.note || '';
  }

  // Hvor mange sammenhængende slots er ledige fra et givet starttidspunkt.
  // Den booking der rettes tæller ikke som optaget.
  const freeFrom = st => {
    let n = 0;
    for(let i = slots.indexOf(st); i < slots.length; i++){
      const cur = slots[i];
      const taken = others.some(b =>
        toMin(hhmm(b.start_time)) <= toMin(cur) && toMin(hhmm(b.end_time)) > toMin(cur));
      if(taken) break;
      n++;
    }
    return Math.max(1, Math.min(n, S.settings.max_slots_per_booking));
  };

  const buildSlots = () => {
    const st = $('f-start') ? $('f-start').value : t;
    const max = freeFrom(st);
    const want = parseInt($('f-slots').value,10)
              || (existing ? existing.slot_count : 0)
              || preset || 1;
    $('f-slots').innerHTML = Array.from({length:max},(_,i)=>
      `<option value="${i+1}">${i+1} (${st}–${endOf(st,(i+1)*S.settings.slot_minutes)})</option>`).join('');
    $('f-slots').value = String(Math.min(want, max));
    updateCap();
    if(want > max) showErr(`Der er kun plads til ${max} interval(ler) fra ${st}.`);
  };

  const updateCap = () => {
    const n = parseInt($('f-slots').value,10) * perSlot;
    $('f-cap').textContent = `${catTotal()} dyr valgt · maks. ${perSlot} dyr pr. interval – ${n} dyr med det valgte antal intervaller.`;
  };

  const buildStart = () => {
    if(!$('f-start')) return;
    const cur = $('f-start').value || t;
    $('f-start').innerHTML = slots.map(x=>{
      const busy = others.some(b =>
        toMin(hhmm(b.start_time)) <= toMin(x) && toMin(hhmm(b.end_time)) > toMin(x));
      return busy ? '' : `<option value="${x}" ${x===cur?'selected':''}>${x}</option>`;
    }).join('');
    if(!$('f-start').value) $('f-start').value = $('f-start').options[0]?.value || t;
  };

  // Hent dagens belægning for den valgte dato
  const loadDay = async () => {
    const [rows, load] = await Promise.all([
      loadCalendar(day, day),
      sb.from('v_daily_load').select('*').eq('booking_date', day).maybeSingle()
    ]);
    others = rows.filter(r => !existing || r.id !== existing.id);
    const dl = load.data;
    booked = (dl ? dl.animals_approved + dl.animals_pending : 0)
             - (existing && existing.booking_date === day ? existing.animal_count : 0);
    $('f-day').textContent =
      `${dk(day)} · ${booked} af ${S.settings.max_animals_per_day} dyr booket denne dag`;
    buildStart(); buildSlots();
  };

  if($('f-date')) $('f-date').onchange = async () => {
    day = $('f-date').value; await loadDay();
  };
  if($('f-start')) $('f-start').onchange = buildSlots;
  $('f-slots').onchange = buildSlots;
  catIds.forEach(c => $('f-'+c).oninput = updateCap);
  document.querySelectorAll('#modal-root .stepper button').forEach(btn => btn.onclick = () => {
    const inp = $('f-'+btn.dataset.cat);
    inp.value = Math.max(0, (parseInt(inp.value,10)||0) + parseInt(btn.dataset.step,10));
    updateCap();
  });
  await loadDay();

  $('f-cancel').onclick = () => $('modal-root').innerHTML = '';
  if($('f-animals')) $('f-animals').onclick = () => animalsModal(existing);
  $('f-save').onclick = async () => {
    const counts  = Object.fromEntries(catIds.map(c => [c, parseInt($('f-'+c).value,10)||0]));
    const animals = catIds.reduce((sum,c) => sum + counts[c], 0);
    const nSlots  = parseInt($('f-slots').value,10);
    const start   = $('f-start') ? $('f-start').value : t;
    const override = isAdmin() && !!$('f-override')?.checked;
    if(!(animals>0)) return showErr('Angiv mindst ét dyr, fordelt på kategori.');
    if(animals > nSlots*perSlot && !override)
      return showErr(`${animals} dyr kræver mindst ${Math.ceil(animals/perSlot)} intervaller (maks ${perSlot} dyr pr. interval).`);
    if(!$('f-far').value) return showErr('Vælg landmand.');
    const row = {
      booking_date: day, start_time: start+':00', slot_count: nSlots,
      carrier_id: myCarrier || $('f-car').value,
      farmer_id: $('f-far').value,
      ...Object.fromEntries(catIds.map(c => ['n_'+c, counts[c]])),
      type: $('f-type').value,
      note: $('f-note').value.trim() || null,
      capacity_override: override
    };
    $('f-save').disabled = true;
    let error;
    if(existing){
      ({ error } = await sb.from('bookings').update(row).eq('id', existing.id));
    } else {
      row.status = isAdmin() ? 'GODKENDT' : 'AFVENTER_GODKENDELSE';
      row.created_by = (await sb.auth.getUser()).data.user.id;
      ({ error } = await sb.from('bookings').insert(row));
    }
    $('f-save').disabled = false;
    if(error) return showErr(msg(error));
    $('modal-root').innerHTML = '';
    setView(S.view);
  };
  function showErr(m){ $('f-err').textContent=m; $('f-err').classList.remove('hide'); }
}

// ---------- BOOKINGLISTE ----------
// Bookinger kan markeres til afhentning (checkboks) og samles i én
// køreseddel via koreseddelModal — uafhængigt af Registrer dyr-skærmen.
// Kun godkendte bookinger kan markeres — en booking der endnu afventer
// slagteriets godkendelse skal ikke kunne indgå i en afhentningsplan.
const pickable = r => r.status === 'GODKENDT';

async function renderList(){
  const el = $('v-list');
  const from = todayStr(), to = fmt(addDays(new Date(),60));
  const { data,error } = await sb.from('bookings')
    .select('*, carriers(name), farmers(name, chr, address, zip_code, city)')
    .gte('booking_date',from).lte('booking_date',to)
    .order('booking_date').order('start_time');
  if(error){ el.innerHTML = `<div class="panel err">${msg(error)}</div>`; return; }
  const rows = data||[];
  const eligible = new Set(rows.filter(pickable).map(r=>r.id));
  [...S.pickupSelection].forEach(id => { if(!eligible.has(id)) S.pickupSelection.delete(id); });

  // Grupper allerede oprettede afhentninger (i dag og frem, kun egne
  // bookinger for en transportør pga. RLS), så en tidligere afhentning
  // kan genåbnes/genudskrives uden at genmarkere hver booking manuelt.
  const pickupGroups = (() => {
    const map = new Map();
    rows.filter(r => r.pickup_ref).forEach(r => {
      if(!map.has(r.pickup_ref)) map.set(r.pickup_ref, { ref:r.pickup_ref, date:r.booking_date, ids:[], carriers:new Set() });
      const g = map.get(r.pickup_ref);
      g.ids.push(r.id);
      g.carriers.add(r.carriers?.name||'');
    });
    return [...map.values()].sort((a,b) => a.date===b.date ? a.ref.localeCompare(b.ref) : a.date.localeCompare(b.date));
  })();

  el.innerHTML = `<div class="panel"><h2>${isAdmin()?'Alle bookinger':'Mine bookinger'} (60 dage frem)</h2>
    <div class="toolbar">
      <span id="ks-count" style="color:var(--muted)"></span>
      <div class="spacer"></div>
      <select id="ks-existing" style="width:auto;min-width:240px" ${pickupGroups.length?'':'disabled'}>
        <option value="">${pickupGroups.length?'Åbn eksisterende afhentning…':'Ingen afhentninger oprettet endnu'}</option>
        ${pickupGroups.map(g=>`<option value="${esc(g.ref)}">${dk(g.date)} · ${esc(g.ref)}${isAdmin()?` · ${esc([...g.carriers].filter(Boolean).join(', '))}`:''} (${g.ids.length} booking${g.ids.length>1?'er':''})</option>`).join('')}
      </select>
      <button class="btn sec" id="ks-clear">Ryd valg</button>
    </div>
    <table><tr><th style="padding:4px 8px"><button class="btn" id="ks-mark" style="padding:5px 10px;font-size:12px;white-space:nowrap">Markér til afhentning</button></th><th>Dato</th><th>Tid</th><th>Transportør</th><th>Landmand</th><th>Dyr</th><th>Type</th><th>Status</th><th>Afhentning</th><th></th></tr>
    ${rows.map(r=>`<tr>
      <td>${pickable(r)?`<input type="checkbox" data-pick="${r.id}" style="width:auto" ${S.pickupSelection.has(r.id)?'checked':''}>`:''}</td>
      <td>${dk(r.booking_date)}</td><td>${hhmm(r.start_time)}–${hhmm(r.end_time)}</td>
      <td>${esc(r.carriers?.name)}</td><td>${esc(r.farmers?.name)}</td>
      <td>${r.animal_count}</td><td>${r.type==='PREBOOKING'?'Prebooking':'Booking'}</td>
      <td><span class="tag t-${r.status}">${statusTxt(r.status)}</span></td>
      <td>${r.pickup_ref?esc(r.pickup_ref):'<span style="color:var(--muted)">–</span>'}</td>
      <td style="white-space:nowrap">
        ${isAdmin()?`<button class="btn sec" data-edit="${r.id}">Ret</button>
                     <button class="btn danger" data-del="${r.id}">Slet</button>`:''}
        ${['AFVENTER_GODKENDELSE','GODKENDT'].includes(r.status)
          ? `<button class="btn sec" data-animals="${r.id}">Registrer dyr</button>
             <button class="btn sec" data-cancel="${r.id}">Annullér</button>`:''}
        ${r.type==='PREBOOKING' && ['AFVENTER_GODKENDELSE','GODKENDT'].includes(r.status)
          ? `<button class="btn" data-confirm="${r.id}">Bekræft booking</button>`:''}
      </td></tr>`).join('')}
    </table>${rows.length?'':'<p style="color:var(--muted)">Ingen bookinger.</p>'}</div>`;
  wireRowActions(el, rows, renderList);
  wirePickupToolbar(el, rows, pickupGroups, renderList);
}

function wirePickupToolbar(el, rows, pickupGroups, refresh){
  // "Markér til afhentning" sidder som en rigtig knap i kolonneoverskriften
  // over checkboksene, så den tydeligt ligner det, den er — klikbar, ikke
  // bare en label. Aktiv når mindst én booking er markeret.
  const updateCount = () => {
    const n = S.pickupSelection.size;
    $('ks-count').textContent = n ? `${n} booking${n>1?'er':''} valgt til afhentning` : 'Ingen bookinger valgt til afhentning';
    $('ks-mark').disabled = n===0;
  };
  el.querySelectorAll('[data-pick]').forEach(cb => cb.onchange = () => {
    cb.checked ? S.pickupSelection.add(cb.dataset.pick) : S.pickupSelection.delete(cb.dataset.pick);
    updateCount();
  });
  $('ks-clear').onclick = () => { S.pickupSelection.clear(); refresh(); };
  // Stempler de markerede bookinger med en afhentningskode og åbner
  // derefter køresedlen for netop den gruppe, så man kan sætte
  // chauffør/reg.nr. og udskrive med det samme. Listen genindlæses i
  // baggrunden, så Afhentning-kolonnen og dropdownen er opdateret, når
  // modalen lukkes. driver/plade-parametre er null: rører ikke evt.
  // allerede sat chauffør/reg.nr. (se assign_pickup_ref).
  $('ks-mark').onclick = async () => {
    $('ks-mark').disabled = true;
    const ids = [...S.pickupSelection];
    const { error } = await sb.rpc('assign_pickup_ref', {
      p_booking_ids: ids, p_driver_name: null, p_truck_plate: null, p_trailer_plate: null
    });
    if(error){ $('ks-mark').disabled = false; return alert(msg(error)); }
    refresh();
    const { data } = await sb.from('bookings')
      .select('*, carriers(name), farmers(name, chr, address, zip_code, city)').in('id', ids);
    koreseddelModal(ids, data||[]);
  };
  $('ks-existing').onchange = () => {
    const ref = $('ks-existing').value;
    $('ks-existing').value = '';
    const g = pickupGroups.find(x=>x.ref===ref);
    if(g) koreseddelModal(g.ids, rows);
  };
  updateCount();
}

function wireRowActions(el, rows, refresh){
  // Prebooking -> Booking. Interval og kapacitet er allerede reserveret,
  // så selve typeskiftet kræver ikke ny kapacitetstildeling — men
  // validate_booking sender en godkendt booking tilbage til "Afventer
  // slagteri", hvis det er en transportør (ikke admin), der bekræfter.
  el.querySelectorAll('[data-confirm]').forEach(b => b.onclick = async () => {
    if(!confirm('Bekræft prebookingen som endelig booking?')) return;
    const { error } = await sb.from('bookings').update({type:'BOOKING'}).eq('id',b.dataset.confirm);
    error ? alert(msg(error)) : refresh();
  });
  el.querySelectorAll('[data-animals]').forEach(b => b.onclick = () => {
    animalsModal(rows.find(x=>x.id===b.dataset.animals));
  });
  el.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {
    if(!confirm('Annullér bookingen?')) return;
    const { error } = await sb.from('bookings').update({status:'ANNULLERET'}).eq('id',b.dataset.cancel);
    error ? alert(msg(error)) : refresh();
  });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Slet bookingen permanent? Historikken går tabt – overvej annullering i stedet.')) return;
    const { error } = await sb.from('bookings').delete().eq('id',b.dataset.del);
    error ? alert(msg(error)) : refresh();
  });
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const r = rows.find(x=>x.id===b.dataset.edit);
    bookingModal(r.booking_date, hhmm(r.start_time), r);
  });
}

// ---------- DYR / CHR (grundlag for den lovpligtige køreseddel) ----------
// Rækkefølge matcher den fysiske køreseddel (Ko, Kalv, Kvie, Stud, Tyr).
// Ungtyr er en ny kategori uden fastlagt plads på det fysiske skema endnu
// og tilføjes derfor sidst, så den ikke forskubber de øvrige kolonner.
const CATS = [['KO','Ko/ungko'],['KALV','Kalv 8-12'],['KVIE','Kvie'],['STUD','Stud'],['TYR','Tyr 24+'],['UNGTYR','Ungtyr 12-24']];
const catLabel = c => ({KO:'Ko/ungko',KVIE:'Kvie',TYR:'Tyr 24+',UNGTYR:'Ungtyr 12-24',STUD:'Stud',KALV:'Kalv 8-12'}[c] || c);
const dtFmt = iso => { if(!iso) return ''; const d = new Date(iso); return `${dk(fmt(d))} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

// EID fra øremærket, fx "208 005914700404": landekode 208 (ikke brugt endnu
// - til fremtidigt SEGES-opslag) + 12-cifret krop. Første 7 cifre = CHR,
// sidste 5 = individnummer ("0059147-00404"). Se CLAUDE.md.
function parseEid(raw){
  const s = (raw||'').trim();
  const digits = s.replace(/\D/g,'');
  if(digits.length < 12) return { eid: s||null, chr:null, animalNo:null };
  const body = digits.slice(-12);
  return { eid: s, chr: body.slice(0,7), animalNo: body.slice(7) };
}

// Stavens CSV-eksport: "EID;VID;Date;Time;QAMark". VID bruges ikke.
function parseWandCsv(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l && !l.toUpperCase().startsWith('EID;')).map(line=>{
    const parts = line.split(';');
    const eid = (parts[0]||'').trim();
    const dateStr = parts[2], timeStr = parts[3], qa = parts[4];
    const { chr, animalNo } = parseEid(eid);
    let scanned_at = null;
    if(dateStr && timeStr){
      const [y,mo,da] = dateStr.split('-').map(Number);
      const [hh,mi,ss] = timeStr.split('.').map(Number);
      if(y && mo && da) scanned_at = new Date(y,mo-1,da,hh||0,mi||0,ss||0).toISOString();
    }
    return { eid: eid||null, chr, animal_no: animalNo, qa_mark: parseInt(qa,10)===3?3:2, scanned_at };
  }).filter(r=>r.eid);
}

// CSV-eksport af den aktuelle dyrliste. Kolonner der afventer
// SEGES-integrationen (alder, salmonella, veterinær-/fødevarestatus,
// må slagtes) eksporteres tomme, ligesom i tabellen.
function exportAnimalsCsv(booking, animals){
  const csvEsc = s => `"${(s??'').toString().replace(/"/g,'""')}"`;
  const header = ['CHR','CKR','EID','Leverandør','Kategori','QA-mærke','Alder (mdr.)',
    'Salmonella','Veterinær status','Fødevare status','Må slagtes','Læssetidspunkt','Bemærkning'];
  const lines = animals.map(a => [
    a.chr||'', a.animal_no||'', a.eid||'', booking.farmers?.name||'',
    a.category?catLabel(a.category):'', a.qa_mark===3?'Returdyr':'Standard',
    '', '', '', '', '', a.loaded_at?dtFmt(a.loaded_at):'', a.remarks||''
  ].map(csvEsc).join(';'));
  const csv = [header.map(csvEsc).join(';'), ...lines].join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `dyr_${booking.booking_date}_${(booking.carriers?.name||'').replace(/\W+/g,'_')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Køreseddel — myndighedskrav. Bygges som ÉT dokument for hele afhentningen
// (ikke ét pr. booking): fælles header (dato, transportør, chauffør,
// reg.numre, afhentningskode) og én samlet dyretabel for alle valgte
// bookinger, med en Tid-kolonne så man stadig kan se hvilket interval det
// enkelte dyr hører til. Til visning i app'en eller udskrift (browserens
// eget print, ingen ny afhængighed, intet PDF-bibliotek).
function pickupCommon(bookings, get){
  const vs = new Set(bookings.map(b => get(b) || ''));
  return vs.size===1 ? [...vs][0] : '';
}

function koreseddelDocumentHtml(groups){
  const bookings = groups.map(g => g.booking);
  const date   = pickupCommon(bookings, b=>b.booking_date);
  const ref    = pickupCommon(bookings, b=>b.pickup_ref);
  const carrier = pickupCommon(bookings, b=>b.carriers?.name) || [...new Set(bookings.map(b=>b.carriers?.name).filter(Boolean))].join(', ');
  const driver  = pickupCommon(bookings, b=>b.driver_name);
  const truck   = pickupCommon(bookings, b=>b.truck_plate);
  const trailer = pickupCommon(bookings, b=>b.trailer_plate);

  let n = 0;
  const rows = groups.flatMap(g => g.animals.map(a => {
    const f = g.booking.farmers || {};
    const addrText = esc([f.name, f.address, [f.zip_code, f.city].filter(Boolean).join(' ')].filter(Boolean).join(', '));
    n++;
    return `<tr>
      <td>${n}</td>
      <td>${hhmm(g.booking.start_time)}–${hhmm(g.booking.end_time)}</td>
      <td>${addrText}</td>
      <td>${esc(f.chr||'')}</td>
      <td>${a.chr?esc(a.chr)+(a.animal_no?'-'+esc(a.animal_no):''):''}</td>
      ${CATS.map(([c])=>`<td style="text-align:center">${a.category===c?'✓':''}</td>`).join('')}
      <td>${esc(a.salmonella_status||'')}</td>
      <td>${a.loaded_at?dtFmt(a.loaded_at):''}</td>
      <td>${esc(a.remarks||'')}</td>
    </tr>`;
  })).join('');
  const cols = 5 + CATS.length + 3;

  return `<div class="hdr">
    <div><b>Dato:</b> ${date?dk(date):'–'}${ref?`<br><b>Afhentning:</b> ${esc(ref)}`:''}</div>
    <div><b>Transportør:</b><br>${esc(carrier)}</div>
    <div><b>Chauffør:</b><br>${esc(driver)}</div>
    <div><b>Registreringsnummer</b><br>Forvogn: ${esc(truck)}<br>Anhænger: ${esc(trailer)}</div>
    <div>Himmerlandskød A/S<br>Nordre Ringvej 99, 9620 Aalestrup<br>CHR-nr: 133182 · Tlf. 98 64 14 44</div>
  </div>
  <table><tr><th></th><th>Tid</th><th>Navn og adresse</th><th>CHR-nr.</th><th>CKR-dyrenr.</th>
    ${CATS.map(([,lbl])=>`<th>${lbl}</th>`).join('')}
    <th>Salmonellastatus</th><th>Læssetidspunkt</th><th>Bemærkninger</th></tr>
  ${rows || `<tr><td colspan="${cols}" style="text-align:center;color:#666">Ingen dyr registreret</td></tr>`}</table>`;
}

// groups: [{booking, animals}] — bookingerne der udgør afhentningen.
function printKoreseddel(groups){
  const win = window.open('', '_blank', 'width=1000,height=700');
  if(!win){ alert('Pop-up blokeret – tillad pop-ups for denne side for at udskrive køresedlen.'); return; }
  const ref = pickupCommon(groups.map(g=>g.booking), b=>b.pickup_ref);
  const title = ref ? `Køreseddel – Afhentning ${esc(ref)}` : `Køreseddel – ${esc(groups[0]?.booking.farmers?.name||'')}`;
  win.document.write(`<!DOCTYPE html><html lang="da"><head><meta charset="utf-8"><title>${title}</title>
  <style>
    @page{size:landscape;margin:12mm}
    body{font:12px/1.4 system-ui,Segoe UI,Roboto,sans-serif;margin:20px;color:#111}
    table{border-collapse:collapse;width:100%;margin-top:12px}
    th,td{border:1px solid #333;padding:4px 6px;font-size:11px}
    th{background:#1A3C34;color:#fff}
    .hdr{display:flex;justify-content:space-between;border:1px solid #333;padding:8px;gap:16px;flex-wrap:wrap}
    .hdr div{min-width:150px}
    .foot{margin-top:10px;font-size:11px;color:#333}
  </style></head><body>
  ${koreseddelDocumentHtml(groups)}
  <p class="foot">Udskrevet ${dk(todayStr())} fra Dyremodtagelse – Himmerlandskød.</p>
  <script>window.onload=()=>window.print();<\/script>
  </body></html>`);
  win.document.close();
}

// Henter dyr for de valgte bookinger og viser dem samlet i app'en. Her
// kan chauffør og reg.numre også angives, og bookingerne mærkes med en
// fælles pickup_ref ("gruppering") via assign_pickup_ref() i databasen,
// så man bagefter kan se, hvilke bookinger der hørte til samme afhentning.
async function koreseddelModal(ids, rows){
  if(!ids.length) return;
  const bookings = ids.map(id => rows.find(r=>r.id===id)).filter(Boolean);
  const { data, error } = await sb.from('booking_animals').select('*').in('booking_id', ids).order('created_at');
  if(error){ alert(msg(error)); return; }
  const animals = data||[];

  // Fælles værdi hvis alle valgte bookinger er enige, ellers tom (så
  // formularen ikke lyver om en blandet gruppe).
  const commonVal = key => { const vs = new Set(bookings.map(b=>b[key]||'')); return vs.size===1 ? [...vs][0] : ''; };

  const render = () => {
    const groups = bookings.map(b => ({ booking:b, animals: animals.filter(a=>a.booking_id===b.id) }));
    const docHtml = koreseddelDocumentHtml(groups);
    const ref = commonVal('pickup_ref');
    $('modal-root').innerHTML = `<div class="overlay"><div class="modal" style="max-width:1100px">
      <h2>Køreseddel – ${groups.length} booking${groups.length>1?'er':''}${ref?` · Afhentning ${esc(ref)}`:''}</h2>
      <div class="row">
        <div><label>Chauffør</label><input id="ks-driver" value="${esc(commonVal('driver_name'))}"></div>
        <div><label>Forvogn – reg.nr.</label><input id="ks-truck" value="${esc(commonVal('truck_plate'))}"></div>
        <div><label>Anhænger – reg.nr.</label><input id="ks-trailer" value="${esc(commonVal('trailer_plate'))}"></div>
        <div style="flex:0;align-self:end"><button class="btn sec" id="ks-save">${ref?'Gem':'Gem og navngiv afhentning'}</button></div>
      </div>
      <div class="hint">${ref?`Bookingerne er grupperet som afhentning ${esc(ref)}.`:'Bookingerne er endnu ikke grupperet til én afhentning – klik "Gem" for at tildele et gruppenummer.'}</div>
      <div id="ks-err" class="err hide"></div>
      <style>
        .ks-doc{background:#fff;color:#111;padding:14px;border-radius:4px;overflow:auto;font:12px/1.4 system-ui,Segoe UI,Roboto,sans-serif;margin-top:12px}
        .ks-doc table{border-collapse:collapse;width:100%;margin-top:12px}
        .ks-doc th,.ks-doc td{border:1px solid #333;padding:4px 6px;font-size:11px}
        .ks-doc th{background:#1A3C34;color:#fff}
        .ks-doc .hdr{display:flex;justify-content:space-between;border:1px solid #333;padding:8px;gap:16px;flex-wrap:wrap}
        .ks-doc .hdr div{min-width:150px}
      </style>
      <div class="ks-doc">${docHtml}</div>
      <p style="display:flex;gap:8px;margin-top:16px">
        <button class="btn" id="ks-print">Udskriv</button>
        <button class="btn sec" id="ks-close">Luk</button>
      </p>
    </div></div>`;
    $('ks-print').onclick = () => printKoreseddel(groups);
    $('ks-close').onclick = () => $('modal-root').innerHTML='';
    $('ks-save').onclick = async () => {
      $('ks-save').disabled = true;
      const { data:newRef, error } = await sb.rpc('assign_pickup_ref', {
        p_booking_ids: ids,
        p_driver_name: $('ks-driver').value.trim(),
        p_truck_plate: $('ks-truck').value.trim(),
        p_trailer_plate: $('ks-trailer').value.trim()
      });
      if(error){
        $('ks-save').disabled = false;
        $('ks-err').textContent = msg(error); $('ks-err').classList.remove('hide');
        return;
      }
      bookings.forEach(b => Object.assign(b, {
        pickup_ref: newRef,
        driver_name: $('ks-driver').value.trim() || null,
        truck_plate: $('ks-truck').value.trim() || null,
        trailer_plate: $('ks-trailer').value.trim() || null
      }));
      render();
    };
  };
  render();
}

// ---------- diverse ----------
function statusTxt(s){
  return {GODKENDT:'Godkendt',AFVENTER_GODKENDELSE:'Afventer slagteri',AFVIST:'Afvist',ANNULLERET:'Annulleret'}[s]||s;
}
function esc(s){ return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Genindlæser den aktive visning hvert 60. sekund, så flere brugere ser
// hinandens ændringer. (Ingen realtime-abonnement.)
setInterval(() => { if(S.profile && !document.querySelector('.overlay')) setView(S.view); }, 60000);

// Tegner kalenderen om ved rotation/vinduesstørrelse, så antallet af
// synlige dage (calDaysShown) følger den nye bredde med det samme, i
// stedet for at vente på det 60-sekunders genindlæs ovenfor.
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(S.view==='cal' && !document.querySelector('.overlay')) renderCal(); }, 200);
});
</script>
